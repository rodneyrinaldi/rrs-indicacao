services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: indicacao-web
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./:/app
      - /app/node_modules
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: indicacao-db
    environment:
      POSTGRES_DB: indicacao
      POSTGRES_USER: indicacao
      POSTGRES_PASSWORD: indicacao
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
